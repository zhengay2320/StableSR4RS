model_id: /data/zhengay/models/stabilityaistable-diffusion-x4-upscaler
data_root: /data/zhengay/EDiffSR-main/data/EDiffSR_worldstrat_rgb_x4_per_image
train_lr_subdir: LR
val_lr_subdir: LR
gt_subdir: GT_geo_rad_visual
output_dir: outputs/stage2_synthetic_cas_all
gt_crop_size: 512
scale: 4
train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
adapter_learning_rate: 1.0e-4
max_train_steps: 20000
mixed_precision: fp16
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
adapter_scale: 1.0
low_res_noise_level_min: 0
low_res_noise_level_max: 20
prompt_mode: fixed
prompt_dropout_probability: 0.1
synthetic_replay_probability: 0.0
snr_gamma: 5.0
validation_steps: 1000
validation_num_samples: 5
validation_num_inference_steps: 40
validation_noise_level: 10
validation_guidance_scale: 1.0
checkpointing_steps: 1000
checkpoints_total_limit: 3
seed: 42
num_workers: 4
gradient_checkpointing: true
enable_xformers_memory_efficient_attention: false
use_8bit_adam: false
strict_pairs: false
resize_low_res_condition_if_needed: false
lr_scheduler: constant
lr_warmup_steps: 0
max_grad_norm: 1.0

# Complete latent Cas-DM is active at every real diffusion timestep.
phi_enabled: true
phi_train_timestep_range: [0.0, 1.0]
phi_infer_timestep_range: [0.0, 1.0]
lambda_z0: 1.0
lambda_mu: 1.0
lambda_lpips: 0.1
phi_learning_rate: 1.0e-4
phi_hidden_channels: 64
phi_time_embed_dim: 128
phi_num_blocks: 3
